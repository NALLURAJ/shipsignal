services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shipsignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shipsignal}
      POSTGRES_DB: ${POSTGRES_DB:-shipsignal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shipsignal}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # one-off job: load the csvs and build the dbt models, then exit
  loader:
    build: .
    command: ["sh", "scripts/build_warehouse.sh"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shipsignal}:${POSTGRES_PASSWORD:-shipsignal}@db:5432/${POSTGRES_DB:-shipsignal}
      POSTGRES_HOST: db
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shipsignal}:${POSTGRES_PASSWORD:-shipsignal}@db:5432/${POSTGRES_DB:-shipsignal}
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
    ports:
      - "8000:8000"
    depends_on:
      loader:
        condition: service_completed_successfully

  app:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
