name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shipsignal
          POSTGRES_PASSWORD: shipsignal
          POSTGRES_DB: shipsignal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shipsignal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://shipsignal:shipsignal@localhost:5432/shipsignal
      POSTGRES_HOST: localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: install
        run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      # the real dataset isn't in the repo, so CI builds everything on a small synthetic sample
      - name: load sample data
        run: |
          python scripts/make_sample_data.py --out data/sample --orders 3000
          python -m ingest.load_raw --data-dir data/sample

      - name: dbt parse and build
        working-directory: warehouse/dbt_shipsignal
        run: |
          dbt parse --profiles-dir .
          dbt build --profiles-dir .

      - name: sqlfluff
        working-directory: warehouse/dbt_shipsignal
        run: sqlfluff lint models tests

      - name: pytest
        run: pytest -q --cov=analysis --cov=api --cov=assistant --cov=eval --cov=common --cov-report=term
