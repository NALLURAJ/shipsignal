name: shipsignal
version: "1.0.0"
config-version: 2

profile: shipsignal

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # an order counts as late when it reaches the customer after the estimated date
  late_grace_days: 0

models:
  shipsignal:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
